# Use vim-style navigation in copy mode
setw -g mode-keys vi

# Store 10K lines of history per pane
set-option -g history-limit 10000

# Open new panes in same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pass OSC 8 hyperlinks through to the outer terminal
set -as terminal-features ',xterm*:hyperlinks'

# Recommended by Claude Code: notifications/progress bar (passthrough),
# focus reporting, and Shift+Enter (extended keys)
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'b0o/tmux-autoreload'

# Plugin options
set -g @continuum-restore 'on'

# Initialize tmux plugin manager (must be last line!)
run '~/.tmux/plugins/tpm/tpm'
